apiVersion: apps/v1
kind: Deployment
metadata:
  name: counter-service
  labels:
    app: counter-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: counter-service
  template:
    metadata:
      labels:
        app: counter-service
    spec:
      containers:
        - name: counter-service
          image: image-registry.openshift-image-registry.svc:5000/<NAMESPACE>/counter-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: counter-service
  labels:
    app: counter-service
spec:
  selector:
    app: counter-service
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: counter-service
  labels:
    app: counter-service
spec:
  to:
    kind: Service
    name: counter-service
    weight: 100
  port:
    targetPort: 8000