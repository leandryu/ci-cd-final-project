apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildah
spec:
  workspaces:
    - name: source

  params:
    - name: IMAGE
      type: string

  steps:
    - name: build-and-push
      image: quay.io/openshift/origin-cli:latest
      workingDir: $(workspaces.source.path)
      env:
        - name: BUILD_NAMESPACE
          value: "$(context.taskRun.namespace)"
      script: |
        #!/bin/sh
        set -eu

        BUILD_NAME="counter-service-tekton"
        IMAGE_NAME="$(echo "$(params.IMAGE)" | sed 's|.*/||')"

        echo "========================================="
        echo "OpenShift Docker Build"
        echo "Namespace: ${BUILD_NAMESPACE}"
        echo "Image: $(params.IMAGE)"
        echo "ImageStreamTag: ${IMAGE_NAME}"
        echo "========================================="

        echo "Checking source workspace..."
        pwd
        echo "Workspace contents:"
        ls -la

        if [ ! -f "Dockerfile" ]; then
          echo "ERROR: Dockerfile was not found in the Tekton workspace."
          exit 1
        fi

        echo "Dockerfile found successfully."

        echo "Removing previous BuildConfig if it exists..."
        oc delete bc "${BUILD_NAME}" \
          -n "${BUILD_NAMESPACE}" \
          --ignore-not-found=true

        echo "Creating BuildConfig..."
        oc new-build \
          --name="${BUILD_NAME}" \
          --strategy=docker \
          --binary=true \
          --to="${IMAGE_NAME}" \
          -n "${BUILD_NAMESPACE}"

        echo "Starting binary build from Tekton workspace..."
        oc start-build "${BUILD_NAME}" \
          --from-dir="$(workspaces.source.path)" \
          --follow \
          -n "${BUILD_NAMESPACE}"

        echo "Checking build status..."
        oc get buildconfig "${BUILD_NAME}" \
          -n "${BUILD_NAMESPACE}"

        echo "Checking generated image..."
        oc get istag "${IMAGE_NAME}" \
        -n "${BUILD_NAMESPACE}"

        echo "Build and push completed successfully."

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: openshift-client
spec:
  params:
    - name: SCRIPT
      type: string
  workspaces:
    - name: source
  steps:
    - name: openshift-client-deploy
      image: quay.io/openshift/origin-cli:latest
      workingDir: $(workspaces.source.path)
      script: $(params.SCRIPT)