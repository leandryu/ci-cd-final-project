---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: This task will clean up a workspace by deleting all the files.
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      script: |
        #!/usr/bin/env sh
        set -eu
        echo "Removing all files from ${WORKSPACE_SOURCE_PATH} ..."
        # Delete any existing contents of the directory if it exists.
        #
        # We don't just "rm -rf ${WORKSPACE_SOURCE_PATH}" because ${WORKSPACE_SOURCE_PATH} might be "/"
        # or the root of a mounted volume.
        if [ -d "${WORKSPACE_SOURCE_PATH}" ] ; then
          # Delete non-hidden files and directories
          rm -rf "${WORKSPACE_SOURCE_PATH:?}"/*
          # Delete files and directories starting with . but excluding ..
          rm -rf "${WORKSPACE_SOURCE_PATH}"/.[!.]*
          # Delete files and directories starting with .. plus any other character
          rm -rf "${WORKSPACE_SOURCE_PATH}"/..?*
        fi

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
spec:
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: output
  steps:
    - name: git-clone
      image: alpine/git:latest
      workingDir: $(workspaces.output.path)
      script: |
        #!/usr/bin/env sh
        set -e
        git clone --branch "$(params.revision)" "$(params.url)" .
        echo "Repository cloned successfully"

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: lint
spec:
  workspaces:
    - name: source
  steps:
    - name: lint-with-eslint
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env sh
        set -e
        npm ci
        npm run lint
        echo "Lint with ESLint finished successfully"

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: unit-test
spec:
  workspaces:
    - name: source
  steps:
    - name: run-unit-tests-jest
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env sh
        set -e
        npm ci
        npm test
        echo "Unit tests (Jest) finished successfully"

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildah
spec:
  params:
    - name: IMAGE
      type: string
    - name: REGISTRY_USERNAME
      type: string
    - name: REGISTRY_PASSWORD
      type: string
    - name: TLSVERIFY
      type: string
      default: "false"
  workspaces:
    - name: source
  steps:
    - name: buildah-build-and-push
      image: quay.io/buildah/stable:latest
      workingDir: $(workspaces.source.path)
      securityContext:
        privileged: true
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        buildah bud \
          --storage-driver=vfs \
          --tls-verify="$(params.TLSVERIFY)" \
          --layers \
          -t "$(params.IMAGE)" .
        buildah push \
          --storage-driver=vfs \
          --tls-verify="$(params.TLSVERIFY)" \
          --creds "$(params.REGISTRY_USERNAME):$(params.REGISTRY_PASSWORD)" \
          "$(params.IMAGE)"
        echo "Image built and pushed successfully"
  volumes:
    - name: varlibcontainers
      emptyDir: {}
  stepTemplate:
    volumeMounts:
      - name: varlibcontainers
        mountPath: /var/lib/containers

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: openshift-client
spec:
  params:
    - name: SCRIPT
      type: string
  workspaces:
    - name: source
  steps:
    - name: openshift-client-deploy
      image: quay.io/openshift/origin-cli:latest
      workingDir: $(workspaces.source.path)
      script: $(params.SCRIPT)