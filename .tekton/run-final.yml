apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: oc-pipelines-oc-final
spec:
  pipelineRef:
    name: oc-pipelines
  workspaces:
    - name: source
      persistentVolumeClaim:
        claimName: console-pvc
  params:
    - name: git-url
      value: "https://github.com/leandryu/ci-cd-final-project.git"
    - name: git-revision
      value: main
    - name: image
      value: image-registry.openshift-image-registry.svc:5000/<NAMESPACE>/counter-service:latest
    - name: registry-username
      value: ""
    - name: registry-password
      value: ""