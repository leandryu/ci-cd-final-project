apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: oc-pipelines
spec:
  workspaces:
    - name: source
  params:
    - name: git-url
      type: string
      default: "https://github.com/leandryu/ci-cd-final-project.git"
    - name: git-revision
      type: string
      default: main
    - name: image
      type: string
    - name: registry-username
      type: string
    - name: registry-password
      type: string
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: source

    - name: git-clone
      runAfter: [cleanup]
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
      workspaces:
        - name: output
          workspace: source

    - name: eslint
      runAfter: [git-clone]
      taskRef:
        name: eslint
      params:
        - name: args
          value: ""
      workspaces:
        - name: source
          workspace: source

    - name: jest-test
      runAfter: [eslint]
      taskRef:
        name: jest-test
      workspaces:
        - name: source
          workspace: source

    - name: buildah
      runAfter: [jest-test]
      taskRef:
        name: buildah
      params:
        - name: IMAGE
          value: $(params.image)
        - name: REGISTRY_USERNAME
          value: $(params.registry-username)
        - name: REGISTRY_PASSWORD
          value: $(params.registry-password)
      workspaces:
        - name: source
          workspace: source

    - name: deploy
      runAfter: [buildah]
      taskRef:
        name: openshift-client
      params:
        - name: SCRIPT
          value: |
            #!/bin/sh
            set -eu

            NAMESPACE="$(context.taskRun.namespace)"

            echo "========================================="
            echo "OpenShift Deployment"
            echo "Namespace: ${NAMESPACE}"
            echo "Application: counter-service"
            echo "Image: $(params.image)"
            echo "========================================="

            echo "Creating/updating deployment..."

            oc -n "${NAMESPACE}" create deployment counter-service \
              --image="$(params.image)" \
              --dry-run=client \
              -o yaml | oc -n "${NAMESPACE}" apply -f -

            echo "Waiting for rollout..."

            oc -n "${NAMESPACE}" rollout status deployment/counter-service \
              --timeout=180s

            echo "Deployment status:"

            oc -n "${NAMESPACE}" get deployment counter-service

            echo "Pods:"

            oc -n "${NAMESPACE}" get pods -l app=counter-service

            echo "Deployment completed successfully."
      workspaces:
        - name: source
          workspace: source